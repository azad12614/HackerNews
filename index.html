<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hacker News</title>
    <style>
      :root {
        --hn-orange: #ff6600;
        --hn-bg: #f6f6ef;
        --hn-muted: #828282;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--hn-bg);
        color: #000;
        font-family: Verdana, Geneva, sans-serif;
      }

      .page {
        width: min(1200px, 100%);
        margin: 0 auto;
      }

      .header {
        min-height: 30px;
        display: flex;
        align-items: center;
        gap: 4px;
        padding: 4px;
        border-bottom: 1px solid var(--hn-orange);
        background: #fffaf0;
        color: var(--hn-orange);
        font-size: 14px;
        line-height: 1;
      }

      .logo {
        width: 23px;
        height: 23px;
        flex: 0 0 23px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border: 1px solid var(--hn-orange);
        background: var(--hn-orange);
        color: #fff;
        font-size: 16px;
        font-weight: 700;
        text-decoration: none;
      }

      .brand {
        margin-right: 4px;
        font-weight: 700;
        white-space: nowrap;
      }

      .nav {
        display: flex;
        align-items: center;
        gap: 4px;
        flex-wrap: wrap;
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      a:hover {
        text-decoration: underline;
      }

      .login {
        margin-left: auto;
        white-space: nowrap;
      }

      main {
        padding: 10px 8px;
        font-size: 13px;
        background: var(--hn-bg);
      }

      .main-card {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 14px 12px;
        border: 1px solid #e5dfcc;
        background: #fffdf7;
      }

      .main-text {
        color: var(--hn-muted);
        font-size: 12px;
      }

      .news-button {
        display: inline-block;
        border: 1px solid var(--hn-orange);
        background: var(--hn-orange);
        color: #fff;
        padding: 7px 12px;
        font-size: 12px;
        font-weight: 700;
        text-decoration: none;
        white-space: nowrap;
      }

      .news-button:hover {
        text-decoration: none;
        background: #e25a00;
      }

      footer {
        margin-top: 10px;
        border-top: 1px solid var(--hn-orange);
        padding: 14px 8px 20px;
        text-align: center;
        color: var(--hn-muted);
        font-size: 11px;
      }

      .footer-links {
        display: flex;
        justify-content: center;
        align-items: center;
        flex-wrap: wrap;
        gap: 4px;
        margin-bottom: 10px;
      }

      .search {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        margin: 0 auto;
        width: min(340px, 100%);
      }

      .search input {
        width: 100%;
        height: 22px;
        border: 1px solid var(--hn-muted);
        padding: 2px 4px;
        font-size: 12px;
      }

      @media (max-width: 640px) {
        .header {
          font-size: 13px;
        }

        .main-card {
          flex-direction: column;
          align-items: flex-start;
        }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <header class="header">
        <a href="/src/pages/news.html" class="logo">Y</a>
        <a href="/src/pages/news.html" class="brand">Hacker News</a>
        <nav class="nav">
          <a href="/src/pages/new.html">new</a>
          <span>|</span>
          <a href="/src/pages/past.html">past</a>
          <span>|</span>
          <a href="/src/pages/comments.html">comments</a>
          <span>|</span>
          <a href="/src/pages/ask.html">ask</a>
          <span>|</span>
          <a href="/src/pages/show.html">show</a>
          <span>|</span>
          <a href="/src/pages/jobs.html">jobs</a>
          <span>|</span>
          <a href="https://news.ycombinator.com/submit">submit</a>
        </nav>
        <a href="https://news.ycombinator.com/login" class="login">login</a>
      </header>

      <main>
        <div class="main-card">
          <p class="main-text">Read the latest stories, comments, and discussions.</p>
          <a class="news-button" href="/src/pages/news.html">Go to News</a>
        </div>
      </main>

      <footer>
        <div class="footer-links">
          <a href="https://news.ycombinator.com/newsguidelines.html">Guidelines</a>
          <span>|</span>
          <a href="https://news.ycombinator.com/newsfaq.html">FAQ</a>
          <span>|</span>
          <a href="https://news.ycombinator.com/lists">Lists</a>
          <span>|</span>
          <a href="https://github.com/HackerNews/API">API</a>
          <span>|</span>
          <a href="https://news.ycombinator.com/security.html">Security</a>
          <span>|</span>
          <a href="https://www.ycombinator.com/legal/">Legal</a>
          <span>|</span>
          <a href="https://www.ycombinator.com/apply/">Apply to YC</a>
        </div>
        <div class="search">
          <label for="search">Search:</label>
          <input id="search" type="text" />
        </div>
      </footer>
      </div>
    </div>
  </body>
</html>
